name: Coletor de apuração

# Roda o coletor em loop no GitHub Actions (grátis em repositório público) e envia o resultado
# para o Worker do Cloudflare. Agendado para a noite do 2º turno (25/10/2026) e disparável à mão.
on:
  schedule:
    - cron: "55 21 25 10 *"  # 18h55 em Brasília (apuração retomada às 19h)
    - cron: "50 3 26 10 *"   # 00h50 em Brasília
  workflow_dispatch:
    inputs:
      eleicao:
        description: "6258 = 2º turno (padrão); 6257 = 1º turno (teste)"
        default: "6258"

concurrency:
  group: coletor
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar e enviar em ciclos contínuos
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: node scripts/collect.mjs --eleicao "${{ inputs.eleicao || '6258' }}" --loop 5 --ate 21000 --post https://eleicoes.katz.rec.br/api/update
