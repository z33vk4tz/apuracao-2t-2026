# Uso (na raiz do repo, num servidor com Docker):  DOMINIO=apuracao.exemplo.com.br docker compose -f deploy/docker-compose.yml up -d
services:
  coletor:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: node scripts/collect.mjs --loop 30
    restart: unless-stopped
  site:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
      - caddy_data:/data
    restart: unless-stopped
volumes:
  caddy_data:
